- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: dsh-web-tools
    fetchProvider: dsh-web-tools-fetch

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: false
  config:
    search: true
    fetch: true
    searchMaxQueries: 4
    searchMaxResults: 8
    searchTimeoutMs: 60000
    fetchTimeoutMs: 30000
    fetchMaxOutputChars: 200000

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: dsh-unconfigured
    model: dsh-unconfigured

- target: '@root'
  insert:
    - id: desktop-integration-host
      name: '@run-bigpig/dsh-desktop-plugin-host'
    - id: desktop-web-tools
      name: '@run-bigpig/dsh-desktop-plugin-host/web-tools'
    - id: desktop-integration-mcp
      name: '@run-bigpig/dsh-desktop-plugin-host/mcp'
      config:
        path: !!js dshHomePath('mcp-servers.json')
    - id: desktop-integration-openpencil
      name: '@run-bigpig/dsh-desktop-plugin-host/openpencil'
    - id: desktop-integration-thinkingdata
      name: '@run-bigpig/dsh-desktop-plugin-host/thinkingdata'
      config:
        path: !!js dshHomePath('thinkingdata.json')
    - id: desktop-integration-vision
      name: '@run-bigpig/dsh-desktop-plugin-host/vision'
      config:
        path: !!js dshHomePath('vision-bridge.json')
    - id: desktop-integration-image
      name: '@run-bigpig/dsh-desktop-plugin-host/image'
      config:
        path: !!js dshHomePath('image-tasks/v1')
    - id: desktop-integration-documents
      name: '@run-bigpig/dsh-desktop-plugin-host/documents'
      config:
        path: !!js dshHomePath('documents/v1')
    - id: desktop-integration-workspace
      name: '@run-bigpig/dsh-desktop-plugin-host/workspace'
    - id: desktop-integration-git
      name: '@run-bigpig/dsh-desktop-plugin-host/git'
    - id: desktop-integration-chart-presentation
      name: '@run-bigpig/dsh-desktop-plugin-host/chart-presentation'
    - id: desktop-integration-client
      name: '@run-bigpig/dsh-desktop-plugin-client'
