<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DeepSeek Harness Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/wails/runtime.js" type="module"></script>
</head>
<body data-phase="starting">
  <div class="atmosphere" aria-hidden="true">
    <i class="glow glow-one"></i>
    <i class="glow glow-two"></i>
  </div>

  <main class="app-frame">
    <section class="boot-view" aria-label="Harness 启动进度">
      <div class="absorption-stage" id="absorptionStage">
        <div class="water-mass" aria-hidden="true">
          <i class="water-ring ring-outer"></i>
          <i class="water-ring ring-middle"></i>
          <i class="water-ring ring-inner"></i>
          <span class="bubble bubble-a"></span>
          <span class="bubble bubble-b"></span>
          <span class="bubble bubble-c"></span>
          <span class="bubble bubble-d"></span>
          <span class="bubble bubble-e"></span>
        </div>
        <span class="fish-core" aria-hidden="true"><img src="deepseek-fish.svg" alt=""></span>
        <p id="progressText" aria-live="polite">正在唤醒桌面核心 · 06%</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
