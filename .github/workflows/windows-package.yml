name: Windows Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version without v (blank uses Taskfile.yml)
        required: false
        default: ""
      publish_tag:
        description: Optional existing tag to receive the generated release assets
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref_type == 'tag' && github.ref_name || inputs.publish_tag || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_tag: ${{ steps.version.outputs.publish_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || inputs.publish_tag || github.ref }}

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif (([string]$env:DISPATCH_VERSION).Trim()) {
            ([string]$env:DISPATCH_VERSION).Trim()
          } else {
            $match = [regex]::Match((Get-Content Taskfile.yml -Raw), '(?m)^  VERSION: "([^"]+)"\r?$')
            if (-not $match.Success) { throw "Taskfile.yml has no desktop VERSION" }
            $match.Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid desktop version: $version"
          }
          $publishTag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { ([string]$env:PUBLISH_TAG).Trim() }
          if ($publishTag -and $publishTag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $publishTag"
          }
          if ($publishTag -and $publishTag.TrimStart("v") -ne $version) {
            throw "Release tag $publishTag does not match desktop version $version"
          }
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve build commit" }
          "source_sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish_tag=$publishTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify locked release inputs
        shell: pwsh
        run: |
          $seed = Get-Content release/seed.lock.json -Raw | ConvertFrom-Json
          $embedded = Get-Content internal/seed/seed.lock.json -Raw | ConvertFrom-Json
          foreach ($field in 'repository', 'commit', 'ref', 'cliEntry', 'node', 'pnpm', 'uv') {
            if (-not $seed.$field -or $seed.$field -ne $embedded.$field) { throw "Seed locks disagree: $field" }
          }
          if ($seed.commit -cnotmatch '^[0-9a-f]{40}$') { throw "Harness must use a full commit SHA" }
          $tools = (Get-Content release/toolchain.lock.json -Raw | ConvertFrom-Json).artifacts
          foreach ($name in 'node', 'pnpm', 'uv') {
            $artifact = @($tools | Where-Object { $_.name -eq $name -and $_.platform -eq 'windows' -and $_.architecture -eq 'x64' })
            if ($artifact.Count -ne 1 -or $artifact[0].version -ne $seed.$name) { throw "Toolchain version mismatch: $name" }
          }
          $pluginVersion = [regex]::Match((Get-Content internal/plugin/manager.go -Raw), 'const desktopPluginVersion = "([^"]+)"')
          if (-not $pluginVersion.Success) { throw "Desktop plugin version is missing" }
          foreach ($package in 'plugin-host', 'plugin-client', 'plugin-bundle', 'plugin-design-ui') {
            $manifest = Get-Content "plugin/packages/$package/package.json" -Raw | ConvertFrom-Json
            if ($manifest.version -ne $pluginVersion.Groups[1].Value) { throw "Plugin version mismatch: $package" }
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Restore Windows release cache
        uses: actions/cache@v4
        with:
          path: |
            dist/windows/downloads
            dist/windows/seed-cache
            dist/windows/seed-build/pnpm-store
          key: windows-release-${{ runner.os }}-${{ hashFiles('release/seed.lock.json', 'release/toolchain.lock.json', 'build/licenses/uv/**', 'scripts/prepare-windows-seed.ps1', 'scripts/stage-workspace-runtime.mjs', 'scripts/materialize-workspace-runtime.mjs', 'scripts/windows-build-common.ps1', 'internal/desktop/child-control.mjs', 'plugin/**') }}

      - name: Install build commands
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $toolBin = Join-Path $env:RUNNER_TEMP "starweave-build-tools"
          New-Item -ItemType Directory -Force $toolBin | Out-Null
          $env:GOBIN = $toolBin
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9
          foreach ($required in "task.exe", "wails3.exe") {
            if (-not (Test-Path -LiteralPath (Join-Path $toolBin $required))) {
              throw "Build command was not installed: $required"
            }
          }
          $toolBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --version=3.10 -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify release tools
        shell: pwsh
        run: |
          task --version
          wails3 version
          makensis.exe /VERSION
          go version

      - name: Run Windows unit tests
        shell: pwsh
        run: task test:windows

      - name: Build verified NSIS installer
        shell: pwsh
        env:
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist/windows/logs | Out-Null
          task "VERSION=$env:DESKTOP_VERSION" release:windows 2>&1 | Tee-Object -FilePath dist/windows/logs/release.log
          if ($LASTEXITCODE -ne 0) { throw "Windows release build failed (exit $LASTEXITCODE)" }

      - name: Verify installer checksum
        shell: pwsh
        run: |
          . ./scripts/windows-build-common.ps1
          $installer = "dist/windows/StarWeaveInstaller.exe"
          $sidecar = $installer + ".sha256"
          $actual = Get-SHA256File $installer
          $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Installer checksum sidecar does not match the generated installer"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: StarWeave-Windows-x64-${{ steps.version.outputs.version }}
          path: |
            dist/windows/StarWeaveInstaller.exe
            dist/windows/StarWeaveInstaller.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarWeave-Windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/windows/logs/
            dist/windows/stage/resources/seed/build-manifest.json
            dist/windows/stage/desktop-build.json
            dist/windows/installer-build.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish tag release assets
    if: needs.package.outputs.publish_tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.package.outputs.publish_tag }}

      - name: Verify release commit
        shell: bash
        env:
          BUILD_SHA: ${{ needs.package.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$BUILD_SHA"

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: StarWeave-Windows-x64-${{ needs.package.outputs.version }}
          path: release-assets

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.publish_tag }}
        run: |
          (cd release-assets && sha256sum --check StarWeaveInstaller.exe.sha256)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$TAG" \
            release-assets/StarWeaveInstaller.exe \
            release-assets/StarWeaveInstaller.exe.sha256 \
            --clobber
