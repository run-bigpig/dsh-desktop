- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: web
  name: '@deepseek-ai/dsh-web'
  config: {}

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: dsh-unconfigured
    model: dsh-unconfigured

- target: '@root'
  insert:
    - id: desktop-integration-host
      name: '@run-bigpig/dsh-desktop-plugin-host'
    - id: desktop-integration-mcp
      name: '@run-bigpig/dsh-desktop-plugin-host/mcp'
      config:
        path: !!js dshHomePath('mcp-servers.json')
    - id: desktop-integration-vision
      name: '@run-bigpig/dsh-desktop-plugin-host/vision'
      config:
        path: !!js dshHomePath('vision-bridge.json')
    - id: desktop-integration-image
      name: '@run-bigpig/dsh-desktop-plugin-host/image'
      config:
        path: !!js dshHomePath('image-tasks/v1')
    - id: desktop-integration-documents
      name: '@run-bigpig/dsh-desktop-plugin-host/documents'
      config:
        path: !!js dshHomePath('documents/v1')
    - id: desktop-integration-workspace
      name: '@run-bigpig/dsh-desktop-plugin-host/workspace'
    - id: desktop-integration-git
      name: '@run-bigpig/dsh-desktop-plugin-host/git'
    - id: desktop-integration-ta-presentation
      name: '@run-bigpig/dsh-desktop-plugin-host/ta-presentation'
    - id: desktop-integration-thinking-levels
      name: '@run-bigpig/dsh-desktop-plugin-host/thinking'
      config:
        enableMappings: false
        onUnsupported: fail
        rules: []
    - id: desktop-integration-client
      name: '@run-bigpig/dsh-desktop-plugin-client'
