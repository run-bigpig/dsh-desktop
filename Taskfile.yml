version: "3"

vars:
  APP_NAME: StarWeave{{exeExt}}
  VERSION: "0.2.7"
  RELEASE_API: "https://api.github.com/repos/run-bigpig/dsh-desktop/releases/latest"

tasks:
  test:
    desc: Run platform-independent unit and Node fixture tests
    cmds:
      - go test ./internal/appconfig ./internal/state ./internal/runtime ./internal/openpencil ./internal/update ./internal/selfupdate ./internal/logging ./internal/backup ./internal/seed

  build:windows:
    desc: Build and fingerprint the production Windows x64 desktop executable
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1 -Version {{.VERSION}} -ReleaseAPI {{.RELEASE_API}}

  seed:windows:
    desc: Build the locked Windows seed with bundled Harness workspaces and install-time dependencies
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-windows-seed.ps1

  package:windows:
    desc: Package the current verified Windows stage without rebuilding Harness
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Version {{.VERSION}} -ReleaseAPI {{.RELEASE_API}}

  release:windows:
    desc: Sequentially rebuild the verified stage and package the NSIS installer
    platforms: [windows]
    cmds:
      - task: seed:windows
      - task: build:windows
      - task: package:windows
