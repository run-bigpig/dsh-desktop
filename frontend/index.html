<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>StarWeave</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/wails/runtime.js" type="module"></script>
</head>
<body data-phase="starting" data-view="boot">
  <div class="atmosphere" aria-hidden="true">
    <i class="glow glow-one"></i>
    <i class="glow glow-two"></i>
    <i class="star-field stars-near"></i>
    <i class="star-field stars-far"></i>
  </div>

  <main class="app-frame">
    <section class="boot-view" aria-label="星织启动进度">
      <div class="convergence-stage" id="convergenceStage">
        <div class="weave-field" aria-hidden="true">
          <i class="weave-thread thread-1"></i>
          <i class="weave-thread thread-2"></i>
          <i class="weave-thread thread-3"></i>
          <i class="weave-thread thread-4"></i>
          <i class="weave-thread thread-5"></i>
          <i class="weave-thread thread-6"></i>
          <i class="weave-thread thread-7"></i>
          <i class="weave-thread thread-8"></i>
          <i class="weave-thread thread-9"></i>
          <i class="weave-thread thread-10"></i>
          <i class="weave-orbit orbit-outer"></i>
          <i class="weave-orbit orbit-middle"></i>
          <i class="weave-orbit orbit-inner"></i>
        </div>

        <div class="star-convergence" aria-hidden="true">
          <i class="star-particle star-01"></i>
          <i class="star-particle star-02"></i>
          <i class="star-particle star-03"></i>
          <i class="star-particle star-04"></i>
          <i class="star-particle star-05"></i>
          <i class="star-particle star-06"></i>
          <i class="star-particle star-07"></i>
          <i class="star-particle star-08"></i>
          <i class="star-particle star-09"></i>
          <i class="star-particle star-10"></i>
          <i class="star-particle star-11"></i>
          <i class="star-particle star-12"></i>
          <i class="star-particle star-13"></i>
          <i class="star-particle star-14"></i>
          <i class="star-particle star-15"></i>
          <i class="star-particle star-16"></i>
          <i class="star-particle star-17"></i>
          <i class="star-particle star-18"></i>
          <i class="star-particle star-19"></i>
          <i class="star-particle star-20"></i>
        </div>

        <span class="logo-core" aria-hidden="true">
          <i class="logo-halo"></i>
          <svg class="core-network" viewBox="0 0 240 240" focusable="false">
            <defs>
              <linearGradient id="coreRingCyan" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#dffeff"/>
                <stop offset=".36" stop-color="#35e4ff"/>
                <stop offset="1" stop-color="#4776ff"/>
              </linearGradient>
              <linearGradient id="coreRingGold" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#4c78ff"/>
                <stop offset=".62" stop-color="#b8eaff"/>
                <stop offset="1" stop-color="#ffd98c"/>
              </linearGradient>
              <radialGradient id="coreNodeLight">
                <stop offset="0" stop-color="#fff"/>
                <stop offset=".4" stop-color="#bff8ff"/>
                <stop offset="1" stop-color="#38bfff"/>
              </radialGradient>
            </defs>
            <g class="orbital-rings">
              <ellipse class="core-ring ring-cyan" cx="120" cy="120" rx="96" ry="45" transform="rotate(-18 120 120)"/>
              <ellipse class="core-ring ring-gold" cx="120" cy="120" rx="84" ry="52" transform="rotate(58 120 120)"/>
              <ellipse class="core-ring ring-ghost" cx="120" cy="120" rx="69" ry="69"/>
            </g>
            <g class="network-links">
              <path d="M35 86 73 49 119 31 169 48 207 86 190 139 157 191 104 207 55 174 35 86Z"/>
              <path d="M73 49 88 111 35 86M119 31 88 111 169 48M207 86 151 107 190 139M157 191 151 107 104 207M55 174 88 111 104 207M88 111 120 120 151 107M120 120 157 191"/>
            </g>
            <g class="agent-nodes">
              <circle cx="35" cy="86" r="4.3"/><circle cx="73" cy="49" r="3.2"/>
              <circle cx="119" cy="31" r="4.8"/><circle cx="169" cy="48" r="3.6"/>
              <circle cx="207" cy="86" r="4.2"/><circle cx="190" cy="139" r="3.3"/>
              <circle cx="157" cy="191" r="4.7"/><circle cx="104" cy="207" r="3.4"/>
              <circle cx="55" cy="174" r="4.1"/><circle cx="88" cy="111" r="3.5"/>
              <circle cx="151" cy="107" r="3.8"/>
            </g>
          </svg>
          <span class="core-shell">
            <i class="core-glass"></i>
            <img src="starweave-logo.png" alt="">
          </span>
          <i class="core-signal signal-one"></i>
          <i class="core-signal signal-two"></i>
          <i class="core-signal signal-three"></i>
        </span>

        <div class="core-signature" aria-hidden="true">
          <span>STARWEAVE</span><strong>CORE</strong><i></i><em>AUTONOMOUS AGENT FABRIC</em>
        </div>

        <p id="progressText" aria-live="polite">星织启动中 · 06%</p>
      </div>
    </section>

    <section class="update-view" aria-labelledby="updateTitle">
      <header class="update-header">
        <span class="update-brand" aria-hidden="true"><img src="starweave-logo.png" alt=""></span>
        <div>
          <p class="update-eyebrow">STARWEAVE DESKTOP</p>
          <h1 id="updateTitle">软件更新</h1>
        </div>
        <span class="update-status" id="updateStatus">正在检查</span>
      </header>

      <div class="update-card">
        <div class="version-row">
          <div><span>当前版本</span><strong id="currentVersion">—</strong></div>
          <i aria-hidden="true">→</i>
          <div><span>可用版本</span><strong id="availableVersion">—</strong></div>
        </div>

        <div class="update-summary">
          <h2 id="updateHeading">正在检查更新</h2>
          <p id="updateMessage" aria-live="polite">正在连接 GitHub Release 服务…</p>
        </div>

        <div class="download-progress" id="downloadProgress" hidden>
          <div class="progress-track" role="progressbar" aria-label="更新下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <i id="downloadBar"></i>
          </div>
          <div class="progress-stats">
            <strong id="downloadPercent">0%</strong>
            <span id="downloadDetail">准备下载</span>
            <span id="downloadSpeed">—</span>
          </div>
        </div>

        <div class="release-notes" id="releaseNotes" hidden>
          <span>更新说明</span>
          <p id="releaseNotesText"></p>
        </div>

        <p class="update-assurance">完整安装包将经过 SHA-256 校验；Harness 私有数据和 pnpm 缓存会保留。</p>
      </div>

      <footer class="update-actions">
        <button class="button secondary" id="closeUpdate" type="button">关闭</button>
        <button class="button secondary" id="cancelUpdate" type="button" hidden>取消下载</button>
        <button class="button primary" id="checkUpdate" type="button" hidden>重新检查</button>
        <button class="button primary" id="retryUpdate" type="button" hidden>重试</button>
        <button class="button primary" id="installUpdate" type="button" hidden>下载并安装</button>
      </footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
